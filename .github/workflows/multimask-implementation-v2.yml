name: Multi-mask TDD implementation v2

on:
  push:
    branches: [feature/downloaded-mask-multicandidate]
    paths:
      - ".github/workflows/multimask-implementation-v2.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/downloaded-mask-multicandidate
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[data,onboard,test]'

      - name: Replay failing tests from v1
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          data = yaml.safe_load(Path('.github/workflows/multimask-implementation.yml').read_text())
          steps = data['jobs']['implement']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Add failing multi-mask tests')
          subprocess.run(['bash', '-lc', script], check=True)
          PY

      - name: Verify RED remains the expected missing-feature failure
        run: |
          set +e
          pytest tests/test_run_bop.py -q > /tmp/red-v2.log 2>&1
          status=$?
          set -e
          cat /tmp/red-v2.log
          if [ "$status" -eq 0 ]; then
            echo "Expected tests to be red before production patch"
            exit 1
          fi
          grep -q "_decode_uncompressed_coco_rle" /tmp/red-v2.log
          grep -q "top1_similarity_mean" /tmp/red-v2.log

      - name: Replay implementation with corrected indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          data = yaml.safe_load(Path('.github/workflows/multimask-implementation.yml').read_text())
          steps = data['jobs']['implement']['steps']
          script = next(
              step['run']
              for step in steps
              if step.get('name') == 'Implement multi-mask pipeline in run_bop.py'
          )
          replacements = {
              'textwrap.dedent(download_parser).replace("\\n", "\\n    ")[4:]':
                  'textwrap.indent(textwrap.dedent(download_parser).lstrip("\\n"), "    ")',
              'textwrap.dedent(multi_parser).replace("\\n", "\\n    ")[4:]':
                  'textwrap.indent(textwrap.dedent(multi_parser).lstrip("\\n"), "    ")',
              'textwrap.dedent(extra_commands).replace("\\n", "\\n    ")[4:]':
                  'textwrap.indent(textwrap.dedent(extra_commands).lstrip("\\n"), "    ")',
          }
          for old, new in replacements.items():
              if old not in script:
                  raise SystemExit(f'expected indentation expression not found: {old}')
              script = script.replace(old, new, 1)
          subprocess.run(['bash', '-lc', script], check=True)
          PY

      - name: Verify GREEN targeted
        run: pytest tests/test_run_bop.py -q

      - name: Verify full unit suite
        run: pytest -q

      - name: Commit implementation and remove temporary workflows
        run: |
          git rm .github/workflows/multimask-implementation.yml .github/workflows/multimask-implementation-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_bop.py tests/test_run_bop.py docs/superpowers/plans/2026-08-27-freezev2-downloaded-mask-multicandidate.md
          git commit -m "feat: add downloaded-mask multi-candidate pipeline"
          git push origin HEAD:feature/downloaded-mask-multicandidate
