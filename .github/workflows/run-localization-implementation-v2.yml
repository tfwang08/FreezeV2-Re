name: Implement dataset localization runner v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-localization-implementation-v2.yml"

permissions:
  contents: write

jobs:
  tdd-run-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install full test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[onboard,test]'

      - name: Materialize TDD test and implementation script
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/run-localization-implementation.yml').read_text()

          def extract(start, end):
              begin = source.index(start) + len(start)
              finish = source.index(end, begin)
              lines = source[begin:finish].splitlines()
              return '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in lines
              ).lstrip('\n') + '\n'

          test_body = extract(
              "          cat > tests/test_run_localization.py <<'PY'\n",
              "          PY\n\n      - name: RED - prove command is missing",
          )
          Path('tests/test_run_localization.py').write_text(test_body)

          implementation = extract(
              "          python - <<'PY'\n",
              "          PY\n\n      - name: GREEN - run dataset-runner test",
          )
          Path('/tmp/implement_run_localization.py').write_text(implementation)
          PY

      - name: RED - prove command is missing
        run: |
          set +e
          pytest -q tests/test_run_localization.py > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the new test to fail before production implementation"
            exit 1
          fi
          grep -q "invalid choice: 'run-localization'" /tmp/red.log

      - name: Implement run-localization
        run: python /tmp/implement_run_localization.py

      - name: GREEN - run dataset-runner test
        run: |
          python -m py_compile run_bop.py
          pytest -q tests/test_run_localization.py

      - name: Run full regression suite
        run: pytest -q

      - name: Commit implementation to main
        run: |
          rm .github/workflows/run-localization-implementation.yml
          rm .github/workflows/run-localization-implementation-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_bop.py tests/test_run_localization.py .github/workflows/run-localization-implementation.yml .github/workflows/run-localization-implementation-v2.yml
          git commit -m "feat: add dataset localization runner"
          git push origin HEAD:main
