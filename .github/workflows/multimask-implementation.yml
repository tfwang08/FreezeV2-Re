name: Multi-mask TDD implementation

on:
  push:
    branches: [feature/downloaded-mask-multicandidate]
    paths:
      - ".github/workflows/multimask-implementation.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/downloaded-mask-multicandidate
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[data,onboard,test]'

      - name: Add failing multi-mask tests
        run: |
          python - <<'PY'
