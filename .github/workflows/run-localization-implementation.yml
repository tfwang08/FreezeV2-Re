name: Implement dataset localization runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-localization-implementation.yml"

permissions:
  contents: write

jobs:
  tdd-run-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Write failing dataset-runner test
        run: |
          cat > tests/test_run_localization.py <<'PY'
          import csv
          import importlib.util
          import json
          import sys
          from pathlib import Path

          import numpy as np


          _RUN_BOP_PATH = Path(__file__).resolve().parents[1] / "run_bop.py"
          _RUN_BOP_SPEC = importlib.util.spec_from_file_location("run_bop_localization", _RUN_BOP_PATH)
          assert _RUN_BOP_SPEC is not None and _RUN_BOP_SPEC.loader is not None
          run_bop = importlib.util.module_from_spec(_RUN_BOP_SPEC)
          _RUN_BOP_SPEC.loader.exec_module(run_bop)


          def test_run_localization_groups_by_image_and_writes_bop_csv(
              tmp_path,
              monkeypatch,
              capsys,
          ):
              bop_root = tmp_path / "bop"
              dataset_root = bop_root / "lmo"
              dataset_root.mkdir(parents=True)
              targets = dataset_root / "test_targets_bop19.json"
              targets.write_text(json.dumps([
                  {"scene_id": 1, "im_id": 2, "obj_id": 3, "inst_count": 1},
                  {"scene_id": 1, "im_id": 2, "obj_id": 4, "inst_count": 1},
                  {"scene_id": 1, "im_id": 3, "obj_id": 3, "inst_count": 1},
              ]))

              query_cache_dir = tmp_path / "features"
              query_cache_dir.mkdir()
              for obj_id in (3, 4):
                  (query_cache_dir / f"lmo_obj_{obj_id:06d}_query.npz").write_bytes(b"cache")

              detection_a = tmp_path / "a.json"
              detection_b = tmp_path / "b.json"
              output = tmp_path / "freezev2-re_lmo-test.csv"
              work_dir = tmp_path / "localization"
              calls = []

              def fake_invoke(argv):
                  argv = list(map(str, argv))
                  calls.append(argv)
                  assert argv[0] == "estimate-multi-mask"
                  scene_id = int(argv[argv.index("--scene-id") + 1])
                  im_id = int(argv[argv.index("--im-id") + 1])
                  obj_id = int(argv[argv.index("--obj-id") + 1])
                  assert (scene_id, im_id) == (1, 2)
                  assert argv.count("--detection-json") == 2
                  query_cache = Path(argv[argv.index("--query-cache") + 1])
                  assert query_cache == query_cache_dir / f"lmo_obj_{obj_id:06d}_query.npz"
                  return {
                      "selected": [{
                          "final_score": 1.0 - 0.1 * (obj_id - 3),
                          "R": np.eye(3).tolist(),
                          "t_mm": [float(obj_id), 20.0, 30.0],
                      }],
                  }

              monkeypatch.setattr(run_bop, "_invoke_main_command", fake_invoke)
              monkeypatch.setattr(sys, "argv", [
                  "run_bop.py",
                  "run-localization",
                  "--dataset",
                  "lmo",
                  "--bop-root",
                  str(bop_root),
                  "--query-cache-dir",
                  str(query_cache_dir),
                  "--detection-json",
                  str(detection_a),
                  "--detection-json",
                  str(detection_b),
                  "--nms-translation-threshold-mm",
                  "5",
                  "--max-images",
                  "1",
                  "--work-dir",
                  str(work_dir),
                  "--output",
                  str(output),
              ])

              run_bop.main()
              report = json.loads(capsys.readouterr().out)

              assert report["processed_image_count"] == 1
              assert report["processed_target_count"] == 2
              assert report["prediction_count"] == 2
              assert report["output"] == str(output)
              assert len(calls) == 2
              assert [int(call[call.index("--obj-id") + 1]) for call in calls] == [3, 4]

              with output.open(newline="") as f:
                  rows = list(csv.DictReader(f))
              assert [(int(row["im_id"]), int(row["obj_id"])) for row in rows] == [
                  (2, 3),
                  (2, 4),
              ]
              assert [float(row["score"]) for row in rows] == [1.0, 0.9]
              assert [float(x) for x in rows[0]["R"].split()] == np.eye(3).reshape(-1).tolist()
              assert [float(x) for x in rows[0]["t"].split()] == [3.0, 20.0, 30.0]
              assert float(rows[0]["time"]) >= 0.0
              assert rows[0]["time"] == rows[1]["time"]
          PY

      - name: RED - prove command is missing
        run: |
          set +e
          pytest -q tests/test_run_localization.py > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the new test to fail before production implementation"
            exit 1
          fi
          grep -q "invalid choice: 'run-localization'" /tmp/red.log

      - name: Implement run-localization
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("run_bop.py")
          text = path.read_text()

          old = "import sys\nimport urllib.request"
          new = "import sys\nimport time\nimport urllib.request"
          if old not in text:
              raise SystemExit("import anchor not found")
          text = text.replace(old, new, 1)

          old = "    prepare_bop_dataset,\n)"
          new = "    prepare_bop_dataset,\n    write_bop_csv,\n)"
          if old not in text:
              raise SystemExit("BOP import anchor not found")
          text = text.replace(old, new, 1)

          helper = textwrap.dedent(r'''
          def _run_localization(args) -> dict:
              if args.max_images is not None and args.max_images <= 0:
                  raise ValueError("--max-images must be positive")
              if args.nms_translation_threshold_mm <= 0 or not np.isfinite(
                  args.nms_translation_threshold_mm
              ):
                  raise ValueError(
                      "--nms-translation-threshold-mm must be positive and finite"
                  )

              targets_json = args.targets_json or (
                  args.bop_root / args.dataset / "test_targets_bop19.json"
              )
              targets_json = Path(targets_json)
              if not targets_json.is_file():
                  raise FileNotFoundError(
                      f"BOP localization targets not found: {targets_json}"
                  )
              targets = json.loads(targets_json.read_text())
              if not isinstance(targets, list):
                  raise ValueError(f"BOP targets must contain a list: {targets_json}")

              image_targets = {}
              image_order = []
              for index, target in enumerate(targets):
                  if not isinstance(target, dict):
                      raise ValueError(f"BOP target {index} is not an object")
                  missing = [
                      key
                      for key in ("scene_id", "im_id", "obj_id", "inst_count")
                      if key not in target
                  ]
                  if missing:
                      raise ValueError(
                          f"BOP target {index} is missing: {', '.join(missing)}"
                      )
                  scene_id = int(target["scene_id"])
                  im_id = int(target["im_id"])
                  obj_id = int(target["obj_id"])
                  inst_count = int(target["inst_count"])
                  if scene_id < 0 or im_id < 0 or obj_id <= 0 or inst_count < 0:
                      raise ValueError(f"BOP target {index} contains invalid ids/count")
                  key = (scene_id, im_id)
                  if key not in image_targets:
                      image_targets[key] = []
                      image_order.append(key)
                  image_targets[key].append({
                      "scene_id": scene_id,
                      "im_id": im_id,
                      "obj_id": obj_id,
                      "inst_count": inst_count,
                  })

              if args.max_images is not None:
                  image_order = image_order[: int(args.max_images)]

              work_dir = args.work_dir or (
                  Path("outputs/localization") / args.dataset
              )
              work_dir = Path(work_dir)
              output = args.output or (
                  Path("outputs/submissions")
                  / f"freezev2-re_{args.dataset}-test.csv"
              )
              output = Path(output)
              query_cache_dir = Path(args.query_cache_dir)

              predictions = []
              image_reports = []
              processed_target_count = 0
              for scene_id, im_id in image_order:
                  started = time.perf_counter()
                  image_predictions = []
                  target_reports = []
                  for target in image_targets[(scene_id, im_id)]:
                      obj_id = target["obj_id"]
                      processed_target_count += 1
                      query_cache = (
                          query_cache_dir
                          / f"{args.dataset}_obj_{obj_id:06d}_query.npz"
                      )
                      if not query_cache.is_file():
                          raise FileNotFoundError(
                              f"query cache not found: {query_cache}"
                          )

                      target_work_dir = (
                          work_dir
                          / f"scene_{scene_id:06d}_im_{im_id:06d}_obj_{obj_id:06d}"
                      )
                      target_output = target_work_dir / "result.json"
                      argv = [
                          "estimate-multi-mask",
                          "--dataset", args.dataset,
                          "--scene-id", str(scene_id),
                          "--im-id", str(im_id),
                          "--obj-id", str(obj_id),
                          "--bop-root", str(args.bop_root),
                          "--split", args.split,
                          "--query-cache", str(query_cache),
                          "--targets-json", str(targets_json),
                          "--nms-translation-threshold-mm",
                          str(args.nms_translation_threshold_mm),
                          "--dinov2-root", str(args.dinov2_root),
                          "--gedi-root", str(args.gedi_root),
                          "--checkpoint", str(args.checkpoint),
                          "--device", args.device,
                          "--grid-size", str(args.grid_size),
                          "--dense-size", str(args.dense_size),
                          "--top-k", str(args.top_k),
                          "--iterations", str(args.iterations),
                          "--seed", str(args.seed),
                          "--edge-similarity-threshold",
                          str(args.edge_similarity_threshold),
                          "--icp-max-iterations", str(args.icp_max_iterations),
                          "--work-dir", str(target_work_dir),
                          "--output", str(target_output),
                      ]
                      for detection_json in args.detection_json or []:
                          argv += ["--detection-json", str(detection_json)]

                      target_report = _invoke_main_command(argv)
                      selected = target_report.get("selected", [])
                      if not isinstance(selected, list):
                          raise RuntimeError(
                              "estimate-multi-mask returned invalid selected poses"
                          )
                      for pose_index, selected_pose in enumerate(selected):
                          R = np.asarray(selected_pose["R"], dtype=np.float64)
                          t = np.asarray(selected_pose["t_mm"], dtype=np.float64)
                          score = float(selected_pose["final_score"])
                          if R.shape != (3, 3) or t.shape != (3,):
                              raise ValueError(
                                  "selected pose must contain R=3x3 and t_mm=3"
                              )
                          if (
                              not np.isfinite(R).all()
                              or not np.isfinite(t).all()
                              or not np.isfinite(score)
                          ):
                              raise ValueError("selected pose contains non-finite values")
                          pose = np.eye(4, dtype=np.float64)
                          pose[:3, :3] = R
                          pose[:3, 3] = t
                          image_predictions.append({
                              "scene_id": scene_id,
                              "im_id": im_id,
                              "obj_id": obj_id,
                              "score": score,
                              "pose": pose,
                          })
                      target_reports.append({
                          "obj_id": obj_id,
                          "inst_count": target["inst_count"],
                          "selected_count": len(selected),
                          "result": str(target_output),
                      })

                  image_time = max(0.0, time.perf_counter() - started)
                  for prediction in image_predictions:
                      prediction["time"] = image_time
                  predictions.extend(image_predictions)
                  image_reports.append({
                      "scene_id": scene_id,
                      "im_id": im_id,
                      "time": image_time,
                      "prediction_count": len(image_predictions),
                      "targets": target_reports,
                  })

              write_bop_csv(output, predictions)
              return {
                  "dataset": args.dataset,
                  "targets_json": str(targets_json),
                  "processed_image_count": len(image_order),
                  "processed_target_count": processed_target_count,
                  "prediction_count": len(predictions),
                  "max_images": args.max_images,
                  "nms_translation_threshold_mm": float(
                      args.nms_translation_threshold_mm
                  ),
                  "query_cache_dir": str(query_cache_dir),
                  "detection_sources": [
                      str(path) for path in (args.detection_json or [])
                  ],
                  "work_dir": str(work_dir),
                  "output": str(output),
                  "images": image_reports,
              }
          ''').lstrip("\n")

          anchor = "\n\ndef main() -> None:\n"
          if anchor not in text:
              raise SystemExit("main anchor not found")
          text = text.replace(anchor, "\n\n" + helper + "\n\ndef main() -> None:\n", 1)

          parser_block = textwrap.dedent(r'''
              localization = subparsers.add_parser(
                  "run-localization",
                  help="Run multi-mask localization over a BOP target set and write CSV",
              )
              localization.add_argument(
                  "--dataset", required=True, choices=sorted(REFERENCE_SUBMISSIONS)
              )
              localization.add_argument(
                  "--bop-root", type=Path, default=Path("data/bop")
              )
              localization.add_argument("--split", default="test")
              localization.add_argument(
                  "--query-cache-dir", type=Path, default=Path("outputs/features")
              )
              localization.add_argument(
                  "--detection-json", type=Path, action="append"
              )
              localization.add_argument("--targets-json", type=Path)
              localization.add_argument(
                  "--nms-translation-threshold-mm", type=float, required=True
              )
              localization.add_argument(
                  "--dinov2-root", type=Path, default=Path("external/dinov2")
              )
              localization.add_argument(
                  "--gedi-root", type=Path, default=Path("external/gedi")
              )
              localization.add_argument(
                  "--checkpoint",
                  type=Path,
                  default=Path("external/gedi/data/chkpts/3dmatch/chkpt.tar"),
              )
              localization.add_argument("--device", default="cuda")
              localization.add_argument("--grid-size", type=int, default=16)
              localization.add_argument("--dense-size", type=int, default=3000)
              localization.add_argument("--top-k", type=int, default=10)
              localization.add_argument("--iterations", type=int, default=10_000)
              localization.add_argument("--seed", type=int, default=0)
              localization.add_argument(
                  "--edge-similarity-threshold", type=float, default=0.9
              )
              localization.add_argument("--icp-max-iterations", type=int, default=30)
              localization.add_argument("--max-images", type=int)
              localization.add_argument("--work-dir", type=Path)
              localization.add_argument("--output", type=Path)
          ''').lstrip("\n")
          parser_block = textwrap.indent(parser_block, "    ")
          anchor = '    multi.add_argument("--output", type=Path)\n\n    args = parser.parse_args()\n'
          if anchor not in text:
              raise SystemExit("parser anchor not found")
          text = text.replace(
              anchor,
              '    multi.add_argument("--output", type=Path)\n\n'
              + parser_block
              + "\n    args = parser.parse_args()\n",
              1,
          )

          old = textwrap.dedent(r'''
              if args.command == "estimate-multi-mask":
                  report = _estimate_multi_mask(args)
                  print(json.dumps(report, indent=2, sort_keys=True))
                  return

              if args.command == "extract-target":
          ''').lstrip("\n")
          old = textwrap.indent(old, "    ")
          new = textwrap.dedent(r'''
              if args.command == "estimate-multi-mask":
                  report = _estimate_multi_mask(args)
                  print(json.dumps(report, indent=2, sort_keys=True))
                  return

              if args.command == "run-localization":
                  report = _run_localization(args)
                  print(json.dumps(report, indent=2, sort_keys=True))
                  return

              if args.command == "extract-target":
          ''').lstrip("\n")
          new = textwrap.indent(new, "    ")
          if old not in text:
              raise SystemExit("command-dispatch anchor not found")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: GREEN - run dataset-runner test
        run: |
          python -m py_compile run_bop.py
          pytest -q tests/test_run_localization.py

      - name: Run full regression suite
        run: pytest -q

      - name: Commit implementation to main
        run: |
          rm .github/workflows/run-localization-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_bop.py tests/test_run_localization.py .github/workflows/run-localization-implementation.yml
          git commit -m "feat: add dataset localization runner"
          git push origin HEAD:main
