name: Apply target DINO dispatch patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-target-dino-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch run_bop.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("run_bop.py")
          text = path.read_text()

          old_import = "from freezev2.refinement import refine_pose_cache\n"
          new_import = old_import + (
              "from freezev2.target_cli import extract_target_cache\n"
              "from freezev2.target_features import target_patch_grid as _target_patch_grid\n"
          )
          if text.count(old_import) != 1:
              raise SystemExit(f"expected one refinement import, got {text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)

          old_dispatch = '''    if args.command == "download-reference":\n        print(download_reference_submission(args.dataset, args.output_dir))\n        return\n\n    if args.command == "refine-pose":\n'''
          new_dispatch = '''    if args.command == "download-reference":\n        print(download_reference_submission(args.dataset, args.output_dir))\n        return\n\n    if args.command == "extract-target":\n        report = extract_target_cache(\n            args,\n            dino_cls=DinoExtractor,\n            gedi_cls=GediExtractor,\n        )\n        print(json.dumps(report, indent=2, sort_keys=True))\n        return\n\n    if args.command == "refine-pose":\n'''
          if text.count(old_dispatch) != 1:
              raise SystemExit(f"expected one dispatch anchor, got {text.count(old_dispatch)}")
          text = text.replace(old_dispatch, new_dispatch, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_bop.py
          git diff --cached --check
          git commit -m "feat: use direct target DINO patch tokens"
          git push
