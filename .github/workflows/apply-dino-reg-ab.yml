name: Verify target inherits DINO register backbone

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-dino-reg-ab.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make target inheritance test non-default
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_target_cli.py")
          text = path.read_text()

          old = '        dino_model=np.array("dinov2_vitg14"),\n'
          new = '        dino_model=np.array("dinov2_vitg14_reg"),\n'
          if text.count(old) != 1:
              raise SystemExit(f"query cache dino model anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        "dinov2_vitg14",\n        dinov2_root,\n'''
          new = '''        "dinov2_vitg14_reg",\n        dinov2_root,\n'''
          if text.count(old) != 1:
              raise SystemExit(f"target dino expectation anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_target_cli.py
          git diff --cached --check
          git commit -m "test: target inherits query DINO backbone"
          git push
