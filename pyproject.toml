[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freezev2-re"
version = "0.1.0"
description = "Minimal paper-faithful FreeZeV2 reproduction for BOP"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
data = ["huggingface_hub>=0.26"]
onboard = ["trimesh>=4.4", "Pillow>=10"]
features = ["torch>=2.1", "Pillow>=10"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["freezev2*"]
exclude = ["external*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
