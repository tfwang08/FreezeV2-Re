name: Apply query crop metadata patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-query-crop-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch run_bop.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("run_bop.py")
          text = path.read_text()

          old = '''from freezev2.pipeline import estimate_pose_from_features\nfrom freezev2.query_features import (\n'''
          new = '''from freezev2.pipeline import estimate_pose_from_features\nfrom freezev2.query_crop import (\n    QUERY_DINO_INPUT_SIZE,\n    QUERY_DINO_MODE,\n    QUERY_DINO_PATCH_GRID,\n)\nfrom freezev2.query_features import (\n'''
          if text.count(old) != 1:
              raise SystemExit(f"import anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''            visual_aggregation=np.array("pixel_lift_nn_view_uniform"),\n            visual_weighting_candidate=np.array("pixel_support"),\n'''
          new = '''            visual_aggregation=np.array("tight_crop_224_pixel_lift_nn_view_uniform"),\n            visual_weighting_candidate=np.array("pixel_support"),\n            query_dino_mode=np.array(QUERY_DINO_MODE),\n            query_dino_input_hw=np.asarray(\n                [QUERY_DINO_INPUT_SIZE, QUERY_DINO_INPUT_SIZE], dtype=np.int32\n            ),\n            query_dino_patch_grid=np.asarray(\n                [QUERY_DINO_PATCH_GRID, QUERY_DINO_PATCH_GRID], dtype=np.int32\n            ),\n'''
          if text.count(old) != 1:
              raise SystemExit(f"save metadata anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''            "visual_aggregation": "pixel_lift_nn_view_uniform",\n            "visual_weighting_candidate": "pixel_support",\n'''
          new = '''            "visual_aggregation": "tight_crop_224_pixel_lift_nn_view_uniform",\n            "visual_weighting_candidate": "pixel_support",\n            "query_dino_mode": QUERY_DINO_MODE,\n            "query_dino_input_hw": [QUERY_DINO_INPUT_SIZE, QUERY_DINO_INPUT_SIZE],\n            "query_dino_patch_grid": [QUERY_DINO_PATCH_GRID, QUERY_DINO_PATCH_GRID],\n'''
          if text.count(old) != 1:
              raise SystemExit(f"report metadata anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''                "visual_aggregation",\n                "visual_weighting_candidate",\n                "dino_layer",\n'''
          new = '''                "visual_aggregation",\n                "visual_weighting_candidate",\n                "query_dino_mode",\n                "query_dino_input_hw",\n                "query_dino_patch_grid",\n                "dino_layer",\n'''
          if text.count(old) != 1:
              raise SystemExit(f"fusion metadata anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_bop.py
          git diff --cached --check
          git commit -m "feat: record query crop preprocessing metadata"
          git push
